<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>TD Financial Health - Signup</title>
        <link rel="stylesheet" href="./../../styles/main.css">
    </head>

    <body>
        <section class="signup-hero">
            <div class="signup-hero__title-container">
                <h1>Join the TD Financial Health Beta Program</h1>
            </div>
            <div class="signup-hero__description-container">
                <p>Be among the first to experience TD’s new Financial Health platform — and help shape the future of smarter, healthier money management.</p>
            </div>
        </section>

        <main class="signup-form">
            <form class="signup-form__container">
                <div class="signup-form__input-wrapper">
                    <label for="firstName">First name</label>
                    <input class="signup-form__input" id=firstName type="text" name="firstName" placeholder="">
                </div>

                <div class="signup-form__input-wrapper">
                    <label for="lastName">Last name</label>
                    <input class="signup-form__input" id=lastName type="text" name="lastName" placeholder="">
                </div>

                <div class="signup-form__input-wrapper">
                    <label for="email">Email</label>
                    <input class="signup-form__input" id=email type="email" name="email" placeholder="">
                </div>

                <div class="signup-form__input-wrapper">
                    <label for="password">Password</label>
                    <input class="signup-form__input" id=password type="password" name="password" placeholder="">
                </div>
                <div class="signup-form__input-wrapper">
                    <label for="password">Confirm Password</label>
                    <input class="signup-form__input" id=password type="password" name="password" placeholder="">
                </div>

                <div class="signup-form__input-wrapper" data-></div>

                <div class="signup-form__input-wrapper">
                    <label for="income">Income</label>
                    <input class="signup-form__input" id=income type="text" name="income" placeholder="">
                </div>

                <div class="signup-form__button">
                    <button class="signup-form__button btn" id="submit" type="submit">Sign Up</button>
                </div>
            </form>
        </main>
    </body>
</html>
