<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>TD Signup Confirmation</title>
        <link rel="stylesheet" href="./../../styles/main.css">
    </head>

    <body>
        <header class="site-header">
            <div class="site-header__wrapper">
                <a class="site-header__logo" href="./../../index.html"><img src="./../../assets/logos/td-logo.svg" alt="td logo"></a>
                <nav class="primary-nav__links-wrapper">
                    <ul class="primary-nav__list">
                        <li class="primary-nav__item">
                            <a class="primary-nav__link" href="./../../index.html">TD Financial Health</a>
                        </li>
                        <li class="primary-nav__item">
                            <a class="primary-nav__link" href="./../products/products.html">Features</a>
                        </li>
                        <li class="primary-nav__item">
                            <a class="primary-nav__link" href="./../forms/signup.html">Sign Up</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </header>

        <div class="confirmation-page">
            <section class="confirmation-page__hero">
                <h1 class="confirmation-page__hero-title">Financial Health Starts Now</h1>
            </section>
            
            <main class="confirmation-page__container">
                <div class="confirmation-page__icon-checkmark">
                    <img class="icon__checkmark" src="../../assets/icons/checkmark.svg" alt="checkmark">
                </div>
                <div class="confirmation-page__title-container">
                    <h2 class="confirmation-page__title">You're In!</h2>
                </div>
                <div class="confirmation-page__description-container">
                    <p class="confirmation-page__description">Thanks for signing up for the TD Financial Health Beta. We’re excited to have you on board — watch your inbox for your invitation and updates coming soon.</p>
                </div>
            </main>
        </div>
    </body>
</html>
