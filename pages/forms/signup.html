<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>TD Financial Health - Signup</title>
        <link rel="stylesheet" href="./../../styles/main.css">
        <script type="module" src="../../scripts/signup.js"></script>
    </head>

    <body>
        <header class="site-header">
            <div class="site-header__wrapper">
                <a class="site-header__logo" href="index.html"><img src="./../../assets/logos/td-logo.svg" alt="td logo"></a>
                <nav class="primary-nav__links-wrapper">
                    <ul class="primary-nav__list">
                        <li class="primary-nav__item">
                            <a class="primary-nav__link" href="index.html">TD Financial Health</a>
                        </li>
                        <li class="primary-nav__item">
                            <a class="primary-nav__link" href="./pages/products/products.html">Features</a>
                        </li>
                        <li class="primary-nav__item">
                            <a class="primary-nav__link" href="./pages/forms/signup.html">Sign Up</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </header>

        <div class="signup-page">
            <section class="signup-page__container">
                <div class="signup-page__title-container">
                    <h1>Join the TD Financial Health Beta Program</h1>
                </div>
                <div class="signup-page__description-container">
                    <p>Be among the first to experience TD’s new Financial Health platform — and help shape the future of smarter, healthier money management.</p>
                </div>
            </section>

            <main class="signup-form">
                <form class="signup-form__container">
                    <div class="signup-form__input-wrapper">
                        <input class="signup-form__input" id=firstName type="text" name="firstName" placeholder="First name *">
                        <label for="firstName">Enter your first name</label>
                    </div>
                    
                    <div class="signup-form__input-wrapper">
                        <input class="signup-form__input" id=lastName type="text" name="lastName" placeholder="Last name *">
                        <label for="firstName">Enter your last name</label>
                    </div>

                    <div class="signup-form__input-wrapper">
                        <input class="signup-form__input" id=email type="email" name="email" placeholder="Email *">
                        <label for="firstName">Enter your email</label>
                    </div>

                    <div class="signup-form__input-wrapper">
                        <input class="signup-form__input" id=password type="password" name="password" placeholder="Password *">
                        <label for="firstName">Enter your password</label>
                    </div>
                    <div class="signup-form__input-wrapper">
                        <input class="signup-form__input" id=confirmPassword type="password" name="password" placeholder="Re-enter password *">
                        <label for="firstName">Re-enter your password</label>
                    </div>

                    <div class="signup-form__input-wrapper" data-audience-container></div>
                    <div class="signup-form__input-wrapper" data-income-container></div>

                    <div class="signup-form__button">
                        <button class="signup-form__button--green btn" id="submit" type="submit">Sign Up</button>
                    </div>
                </form>
            </main>
        </div>
    </body>
</html>
